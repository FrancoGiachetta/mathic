name: CI

on:
    push:
        branches: [main]
    pull_request:
    merge_group:
        types: [checks_requested]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


jobs:
    test:
        name: Test Suite
        runs-on: ubuntu-24.04
        env:
          LLVM_SYS_221_PREFIX: "/usr/lib/llvm-22"
          MLIR_SYS_220_PREFIX: "/usr/lib/llvm-22"
          TABLEGEN_220_PREFIX: "/usr/lib/llvm-22"
        steps:
            - uses: actions/checkout@v6

            - name: Install LLVM Dependencies
              uses: ./.github/actions/install-llvm-deps

            - name: Install GiNaC
              shell: bash
              run: sudo apt install libginac-dev

            - name: Install Rust
              uses: dtolnay/rust-toolchain@1.94.0

            - name: Rust Cache
              uses: Swatinem/rust-cache@v2

            - name: Install testing tools
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-nextest

            - name: Run tests
              run: make test

    test-macos:
        name: Test Suite (macOS)
        runs-on: macos-15
        env:
          LIBRARY_PATH: /opt/homebrew/lib
        steps:
            - uses: actions/checkout@v6
            - uses: Homebrew/actions/setup-homebrew@2026.09.13.1

            - name: Install LLVM Dependencies
              run: brew install llvm@22

            - name: Install GiNaC
              shell: bash
              run: brew install cln ginac

            - name: Set LLVM environment
              run: |
                  echo "LLVM_SYS_221_PREFIX=$(brew --prefix llvm@22)" >> $GITHUB_ENV
                  echo "MLIR_SYS_220_PREFIX=$(brew --prefix llvm@22)" >> $GITHUB_ENV
                  echo "TABLEGEN_220_PREFIX=$(brew --prefix llvm@22)" >> $GITHUB_ENV

            - name: Install Rust
              uses: dtolnay/rust-toolchain@1.94.0

            - name: Rust Cache
              uses: Swatinem/rust-cache@v2

            - name: Install testing tools
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-nextest

            - name: Run tests
              run: make test

    clippy:
        name: Linting check
        runs-on: ubuntu-24.04
        env:
          LLVM_SYS_221_PREFIX: "/usr/lib/llvm-22"
          MLIR_SYS_220_PREFIX: "/usr/lib/llvm-22"
          TABLEGEN_220_PREFIX: "/usr/lib/llvm-22"
        steps:
            - uses: actions/checkout@v6

            - name: Install LLVM Dependencies
              uses: ./.github/actions/install-llvm-deps

            - name: Install GiNaC
              shell: bash
              run: sudo apt install libginac-dev

            - name: Install Rust
              uses: dtolnay/rust-toolchain@1.94.0
              with:
                  components: rustfmt, clippy

            - name: Rust Cache
              uses: Swatinem/rust-cache@v2

            - name: Run make check
              run: make check

    format:
        name: Check Formatting
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v6

            - name: Install Rust
              uses: dtolnay/rust-toolchain@1.94.0
              with:
                  components: rustfmt

            - name: Check formatting
              run: cargo fmt --all -- --check

    unused-deps:
        name: Check Unused Dependencies
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v6

            - name: Install Rust
              uses: dtolnay/rust-toolchain@1.94.0

            - name: Check for unused dependencies
              uses: bnjbvr/cargo-machete@main

    coverage:
        name: Coverage
        runs-on: ubuntu-24.04
        env:
          LLVM_SYS_221_PREFIX: "/usr/lib/llvm-22"
          MLIR_SYS_220_PREFIX: "/usr/lib/llvm-22"
          TABLEGEN_220_PREFIX: "/usr/lib/llvm-22"
        steps:
            - uses: actions/checkout@v6

            - name: Install LLVM Dependencies
              uses: ./.github/actions/install-llvm-deps

            - name: Install GiNaC
              shell: bash
              run: sudo apt install libginac-dev

            - name: Install Rust
              uses: dtolnay/rust-toolchain@1.94.0

            - name: Rust Cache
              uses: Swatinem/rust-cache@v2

            - name: Install testing tools
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-nextest,cargo-llvm-cov

            - name: Generate coverage report
              run: cargo llvm-cov nextest --workspace --verbose --lcov --output-path lcov.info

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v4
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: lcov.info
                  fail_ci_if_error: false
                  verbose: true
