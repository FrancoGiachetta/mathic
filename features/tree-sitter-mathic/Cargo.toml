[package]
name = "tree-sitter-mathic"
description = "tree-sitter for Mathic's grammar"
version = "0.1.0"
authors = ["Franco Giachetta <francogiachetta27@gmail.com>"]
license = "Apache"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "mathic"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/francogiachetta/mathic"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.7"
