[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/FrancoGiachetta/mathic"

[workspace]
members = ["euler"]

[workspace.dependencies]
clap = { version = "4.6.4", features = ["derive"] }
mathic = { path = "." }
thiserror = "2.0.10"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[package]
name = "mathic"
description = "A compiler with builtin support of symbolic operations, built with LLVM/MLIR"
keywords = ["compiler", "mlir", "llvm"]
categories = ["compilers"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ariadne = "0.6.0"
libc = "0.2.182"
llvm-sys = "211.0.0"
logos = "0.16.0"
logos-display = "0.1.3"
melior = { version = "0.26.3", features = ["helpers"] }
mlir-sys = "210.0.1"
rayon = "1.12.0"
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rstest = "0.26.1"
criterion = { version = "0.5", features = ["html_reports"] }
pyo3 = { version = "0.23", features = ["auto-initialize"] }

# Profile Settings

[profile.optimized-dev]
inherits = "dev"
opt-level = 3

[profile.ci]
inherits = "dev"
opt-level = 3
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true

# Set the default for dependencies.
[profile.dev.package."*"]
opt-level = 2

[package.metadata.cargo-machete]
ignored = ["libc"]

[[bench]]
name = "eval"
harness = false
